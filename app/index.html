<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Tema antes del primer pintado (copiado de concreta-v2/index.html): la
      // preferencia guardada manda; si no, la del sistema; si no, el claro.
      (function () {
        try {
          var t = null;
          try { t = localStorage.getItem('concreta-theme'); } catch (e) {}
          if (t !== 'light' && t !== 'dark') {
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <!-- El icono de Concreta (concreta-v2/public/favicon.svg e icons/apple-touch-icon-180.png) -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FEM 3D · Visor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
