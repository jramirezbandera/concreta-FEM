# Despliegue de la app (app/, visor y editor) en GitHub Pages en cada push a main.
# https://jramirezbandera.github.io/concreta-FEM/
# La app importa el motor de ../src, así que hacen falta las dependencias de la raíz y las de app/.
# `base: "./"` en app/vite.config.ts deja las rutas relativas, válidas bajo /concreta-FEM/.
# Con la app va la extensión de Claude Desktop (concreta-fem.mcpb, docs/fem3d/agente.md §13.4), que se
# prueba con node antes de publicar; su versión es 0.1.<commits>, así que hace falta la historia entera.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: app
      - run: bunx vite build
        working-directory: app
      - run: bun scripts/paquete-mcpb.ts --usar-dist --copiar-a app/dist
      - run: bun validacion/mcpb/probar.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
