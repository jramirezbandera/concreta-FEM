<!doctype html><html><head><meta charset="utf-8"></head><body><script>
window.snap = async () => {
  const run = (msg, tr) => new Promise((r) => { const w = new Worker("./snap.worker.js", { type: "module" }); w.onmessage = (e) => { r(e.data); w.terminate(); }; w.postMessage(msg, tr || []); });
  const a = await run({ cmd: "hacer" });
  if (!a.ok) return { hacer: a };
  const snap = a.snap; delete a.snap;
  const b = await run({ cmd: "cargar", snap }, [snap.buffer]);
  return { hacer: a, cargar: b };
};
</script></body></html>
