<!doctype html><html><head><meta charset="utf-8"></head><body><script>
window.prueba = async () => {
  const wAntes = new Worker("./w.js");
  const reg = await navigator.serviceWorker.register("./sw-claim.js");
  await new Promise((r) => navigator.serviceWorker.controller ? r() : navigator.serviceWorker.addEventListener("controllerchange", r, { once: true }));
  const pide = (w) => new Promise((r) => { w.onmessage = (e) => r(e.data); w.postMessage(1); });
  const wDespues = new Worker("./w.js");
  return {
    paginaControlada: !!navigator.serviceWorker.controller,
    fetchPagina: (await (await fetch("./dato.txt?p=" + Date.now())).text()).trim(),
    workerCreadoAntesDelClaim: await pide(wAntes),
    workerCreadoDespuesDelClaim: await pide(wDespues),
  };
};
</script></body></html>
